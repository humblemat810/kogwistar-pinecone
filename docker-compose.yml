services:
  pinecone:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    platform: linux/amd64
    environment:
      PORT: 5081
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: 3
      METRIC: cosine
    ports:
      - "5081:5081"

  test:
    build: .
    depends_on:
      - pinecone
    command: ["python", "-m", "pytest", "-q"]
