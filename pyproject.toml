[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-pinecone"
version = "0.1.0"
description = "Pinecone adapter exposing Kogwistar's Chroma-shaped storage contract"
requires-python = ">=3.12"
dependencies = ["pinecone>=7,<8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Pinecone Local or Pinecone Cloud"]
