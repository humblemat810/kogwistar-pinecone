name: CI
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      KOGWISTAR_REVISION: ae24e1663a66deb0e65d6e2bf74a2e5ef317e1ea
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
            is_pypy: false
          - python-version: "3.13"
            experimental: false
            is_pypy: false
          - python-version: "3.14"
            experimental: false
            is_pypy: false
          - python-version: "pypy-3.11-v7.3.20"
            experimental: false
            is_pypy: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
        if: matrix.is_pypy == false
      - name: Install Kogwistar 0.6 contract revision
        if: matrix.is_pypy == false
        run: python -m pip install "git+https://github.com/humblemat810/kogwistar.git@${{ env.KOGWISTAR_REVISION }}"
      - run: python -m pip install --upgrade pip setuptools wheel pytest
        if: matrix.is_pypy
      - run: python -m pytest -vv -ra --tb=long --junitxml=pytest-${{ matrix.python-version }}.xml
        if: matrix.is_pypy == false
      - run: python -m pytest tests/test_pypy_compat.py -vv -ra --tb=long -p no:cacheprovider --junitxml=pytest-${{ matrix.python-version }}.xml
        if: matrix.is_pypy
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-*.xml
          if-no-files-found: ignore

  pinecone-local:
    name: Pinecone Local integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Start official Pinecone Local index emulator
        run: |
          docker run -d --name pinecone-local \
            --platform linux/amd64 \
            -e PORT=5081 \
            -e INDEX_TYPE=serverless \
            -e VECTOR_TYPE=dense \
            -e DIMENSION=3 \
            -e METRIC=cosine \
            -p 5081:5081 \
            ghcr.io/pinecone-io/pinecone-index:latest
      - name: Wait for Pinecone Local through official SDK
        env:
          PINECONE_API_KEY: pclocal
        run: |
          python - <<'PY'
          import os
          import time
          from pinecone import Pinecone

          last_error = None
          for _ in range(30):
              try:
                  index = Pinecone(api_key=os.environ["PINECONE_API_KEY"]).Index(
                      host="http://127.0.0.1:5081"
                  )
                  index.describe_index_stats()
                  print("Pinecone Local ready")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              print(f"Pinecone Local readiness failed: {last_error}")
              raise SystemExit(1)
          PY
      - name: Run Pinecone Local integration contract
        env:
          PINECONE_API_KEY: pclocal
          PINECONE_INDEX_HOST: http://127.0.0.1:5081
        run: python -m pytest tests/test_integration.py -m integration -vv -ra --tb=long --junitxml=pytest-pinecone-local.xml
      - name: Upload Pinecone Local test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-pinecone-local
          path: pytest-pinecone-local.xml
          if-no-files-found: ignore
      - name: Show Pinecone Local logs on failure
        if: failure()
        run: docker logs pinecone-local
      - name: Stop Pinecone Local
        if: always()
        run: docker rm -f pinecone-local
